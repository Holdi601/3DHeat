// The 3DHeat protocol: how a viewer talks to a 3DHeat core.
//
// One schema for every transport. Today the native app's own window talks to its
// Rust core over Tauri IPC (a custom protocol carrying these messages); later a
// browser client talks to a host the same way over WSS. Types are generated from
// this file on both sides (prost in Rust, protobuf-es in TypeScript), never
// written by hand.
//
// Framing: a frame is a little-endian u32 length, an `Envelope` of that length,
// zero padding to the next multiple of 8, then the envelope's raw payload. Bulk
// data (columns, chunks) never goes through protobuf fields: an envelope names its
// payload's buffers (`Buffer`), which are byte ranges of the payload, 8-byte
// aligned, little-endian.
//
// Compatibility: fields are only ever added. A reader ignores fields and `oneof`
// cases it does not know, and answers a request it does not know with an `Error`
// of code UNSUPPORTED. `protocol` is the major version; it changes only when a
// change cannot be made by adding.

syntax = "proto3";

package heat3d.v1;

message Envelope {
  // The protocol major version the sender speaks: PROTOCOL_VERSION.
  uint32 protocol = 1;
  // Chosen by the sender of a request, unique among its requests in flight.
  uint64 id = 2;
  // On a reply or a progress report: the id of the request it answers.
  uint64 reply_to = 3;
  // The session the message belongs to. Empty between a window and its own core;
  // Stage 2b's multiplayer sessions set it.
  string session = 4;

  oneof body {
    Hello hello = 10;
    HelloReply hello_reply = 11;
    Error error = 12;
    Progress progress = 13;
    Cancel cancel = 14;

    OpenDataset open_dataset = 20;
    DatasetInfo dataset_info = 21;
    CloseDataset close_dataset = 22;
    Closed closed = 23;

    ReadColumns read_columns = 30;
    Columns columns = 31;
    ReadTable read_table = 32;
    Table table = 33;
    ScanCsv scan_csv = 34;
    CsvColumns csv_columns = 35;

    BuildChunks build_chunks = 40;
    ChunkSet chunk_set = 41;
    ReadChunk read_chunk = 42;
    ChunkData chunk_data = 43;
    BuildDataset build_dataset = 44;
    DatasetBuilt dataset_built = 45;
    ReadDatasetColumns read_dataset_columns = 46;
    DatasetColumns dataset_columns = 47;
    BuildProgress build_progress = 48;
    BuildProgressReply build_progress_reply = 49;

    Query query = 50;
    QueryReply query_reply = 51;

    Echo echo = 60;
  }

  // Field numbers 100-199 of the body are kept for Stage 2b: sessions, members
  // and roles, presence, follow, "look here" and the shared layers' op-log.
  reserved 100 to 199;
}

enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 1;
}

message Hello {
  // Who is asking: "3dheat-web 0.1.0", say.
  string client = 1;
}

message HelloReply {
  string core = 1;
  string core_version = 2;
  // Threads the core reads with, and the machine's memory in bytes.
  uint32 threads = 3;
  uint64 memory_bytes = 4;
  // What the core reads: "parquet", "csv", "acmi", "3dheat".
  repeated string formats = 5;
  // Requests answered since the core started, by kind ("read_columns": 12).
  map<string, uint64> served = 6;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The request is valid, but this core does not do it (an unknown request, a
  // Parquet type it does not decode): the client reads the file itself.
  ERROR_CODE_UNSUPPORTED = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_INVALID = 3;
  ERROR_CODE_IO = 4;
  ERROR_CODE_CANCELLED = 5;
  ERROR_CODE_INTERNAL = 6;
  ERROR_CODE_NO_MEMORY = 7;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message Progress {
  // A message key of the web app (`data.ingest.parsing`), so the viewer says it in its language.
  string key = 1;
  map<string, string> params = 2;
  // 0..1, or negative when unknown.
  double fraction = 3;
  uint64 rows = 4;
}

message Cancel {
  uint64 request = 1;
}

message Echo {
  // Asks for a reply of this many payload bytes: for measuring the transport.
  uint64 payload_bytes = 1;
}

// ---------------------------------------------------------------- files

// A file the core can read.
message FileRef {
  oneof source {
    // A path on the core's machine.
    string path = 1;
    // A file the viewer's window handed to the core (a picked or dropped file),
    // by the token the core gave it.
    string token = 2;
  }
  // A member of a `.3dheat` container, by its name in the container: the file is then the container.
  string member = 3;
}

enum Format {
  FORMAT_UNSPECIFIED = 0;
  FORMAT_PARQUET = 1;
  FORMAT_CSV = 2;
  FORMAT_ACMI = 3;
  FORMAT_CONTAINER = 4;
}

message OpenDataset {
  repeated FileRef files = 1;
}

message DatasetInfo {
  // Names the dataset in the requests that follow, until it is closed.
  uint64 handle = 1;
  repeated FileInfo files = 2;
}

message FileInfo {
  string name = 1;
  Format format = 2;
  uint64 bytes = 3;
  // Exact for Parquet (the footer) and a read ACMI; an estimate otherwise.
  uint64 rows = 4;
  bool rows_exact = 5;
  repeated ColumnInfo columns = 6;
  uint32 row_groups = 7;
  // The Parquet footer's `heat3d` entry, as written (the file's reading instructions).
  string hints_json = 8;
  // For a container: its manifest, as written, and its members.
  string manifest_json = 9;
  repeated ContainerMember members = 10;
}

message ColumnInfo {
  string name = 1;
  // Parquet physical type ("DOUBLE", "INT64", "BYTE_ARRAY", ...).
  string physical = 2;
  // Logical or converted type ("TIMESTAMP", "STRING", "DATE", ...), empty when none.
  string logical = 3;
  // Stored as text (or bytes) rather than as a number.
  bool text = 4;
  // A point in time: TIMESTAMP or DATE.
  bool timestamp = 5;
}

message ContainerMember {
  string name = 1;
  string role = 2;
  // 0 stored, 8 deflate.
  uint32 method = 3;
  uint64 compressed_bytes = 4;
  uint64 bytes = 5;
  // Where the member's data starts in the container.
  uint64 data_offset = 6;
}

message CloseDataset {
  uint64 handle = 1;
}

message Closed {}

// ---------------------------------------------------------------- columns

enum ColumnKind {
  COLUMN_KIND_UNSPECIFIED = 0;
  // float32 per row; NaN where null or unreadable.
  COLUMN_KIND_F32 = 1;
  // float64 per row, for absolute times.
  COLUMN_KIND_F64 = 2;
  // Text: u32 ids per row into `labels`, interned in order of first appearance.
  COLUMN_KIND_DICT = 3;
}

message ColumnSpec {
  string name = 1;
  ColumnKind kind = 2;
}

// The load plan's pre-filter (`src/data/rowFilter.ts`).
message RowFilterClause {
  string column = 1;
  oneof test {
    SetTest set = 2;
    RangeTest range = 3;
  }
}

message SetTest {
  repeated string values = 1;
}

message RangeTest {
  optional double min = 1;
  optional double max = 2;
}

// Reads columns of one Parquet file (or a container's table), the row filter
// applied first. Rows come back in file order: the k-th kept row is at index k
// of every column.
message ReadColumns {
  FileRef file = 1;
  repeated ColumnSpec columns = 2;
  repeated RowFilterClause filter = 3;
  // Also send, per kept row, its row in the file (u32): for columns read later.
  bool kept_rows = 4;
}

message Columns {
  uint64 rows_total = 1;
  uint64 rows = 2;
  FilterStats filtered = 3;
  repeated ColumnData columns = 4;
  // When asked for: the file row of each kept row, u32.
  Buffer kept_rows = 5;
  Timing timing = 6;
}

message FilterStats {
  uint64 rows = 1;
  uint64 kept = 2;
  uint64 rows_skipped = 3;
  uint64 groups = 4;
  uint64 groups_skipped = 5;
}

message ColumnData {
  string name = 1;
  ColumnKind kind = 2;
  Buffer values = 3;
  repeated string labels = 4;
}

// A byte range of the frame's payload.
message Buffer {
  uint64 offset = 1;
  uint64 length = 2;
}

message Timing {
  double read_ms = 1;
  double filter_ms = 2;
  double sort_ms = 3;
  double pack_ms = 4;
  double total_ms = 5;
  uint32 threads = 6;
}

// A whole table, read and parsed by the core: an ACMI recording.
message ReadTable {
  FileRef file = 1;
}

message Table {
  uint64 rows = 1;
  // Numbers as F64, text as DICT.
  repeated ColumnData columns = 2;
  // The format's own facts about the table, as JSON (ACMI: title, referenceTime,
  // reference, flatWorld, globals, completeness).
  string info_json = 3;
}

// A delimited file scanned by a plan the viewer made from its mapping
// (`ingestCsv`): which columns become which slots, the row filter, the stride.
message ScanCsv {
  FileRef file = 1;
  uint32 delimiter = 2;
  // Per number slot, its column in the file; -1 for none.
  repeated int32 number_columns = 3;
  // The number slot read at double width (the time), or -1.
  int32 wide_slot = 4;
  repeated int32 text_columns = 5;
  // Number slots holding x, y and z (-1 when unmapped): a row whose mapped axis
  // does not parse is rejected.
  repeated int32 axis_slots = 6;
  repeated CsvTest number_tests = 7;
  repeated CsvTest text_tests = 8;
  uint32 stride = 9;
}

message CsvTest {
  uint32 slot = 1;
  RowFilterClause clause = 2;
}

message CsvColumns {
  uint64 rows = 1;
  uint64 rejected = 2;
  // Set when the plan filtered.
  FilterStats filtered = 3;
  // F32 per number slot (the wide slot as F64), DICT per text slot.
  repeated ColumnData numbers = 4;
  repeated ColumnData texts = 5;
  Timing timing = 6;
}

// ---------------------------------------------------------------- chunks

// The engine's GPU layout, built by the core: rows sorted by time, cut into
// chunks of 2^23 rows, each quantised against its own box. Per chunk:
//   positions: two u32 per row, x | y << 16 and z | group << 16 (u16 each);
//   times:     one u32 per row, time | lifetime << 16, lifetime 65535 for none.
// As `WebgpuRenderer.flushDataUpload` packs them (src/render/webgpu/renderer.ts).
message BuildChunks {
  repeated FileRef files = 1;
  // Source columns for the roles; empty for none.
  string x = 2;
  string y = 3;
  string z = 4;
  string time = 5;
  string person = 6;
  string group = 7;
  // Seconds per time unit of the source (1 for seconds, 0.001 for milliseconds).
  double time_scale = 8;
  repeated RowFilterClause filter = 9;
  uint32 stride = 10;
  // Rows per chunk; 0 for the engine's 2^23.
  uint32 chunk_rows = 11;
}

message ChunkSet {
  uint64 handle = 1;
  uint64 rows = 2;
  uint64 rows_read = 3;
  double time_min = 4;
  double time_max = 5;
  float max_lifetime_gap = 6;
  repeated ChunkInfo chunks = 7;
  Timing timing = 8;
  // Peak resident memory of the core so far, bytes.
  uint64 peak_memory_bytes = 9;
  repeated string group_labels = 10;
}

message ChunkInfo {
  uint32 index = 1;
  uint64 start = 2;
  uint32 rows = 3;
  repeated float aabb_min = 4;
  repeated float aabb_size = 5;
  float time_min = 6;
  float time_scale = 7;
  float life_scale = 8;
}

enum ChunkPart {
  CHUNK_PART_UNSPECIFIED = 0;
  CHUNK_PART_POSITIONS = 1;
  CHUNK_PART_TIMES = 2;
}

// A chunk of a `BuildChunks` set, or of a built dataset (`BuildDataset`), packed
// on request.
message ReadChunk {
  uint64 handle = 1;
  uint32 index = 2;
  ChunkPart part = 3;
  // Hand the bytes over in shared memory (the app's window): `ChunkData.shared_id`.
  bool shared = 4;
}

message ChunkData {
  uint32 index = 1;
  ChunkPart part = 2;
  Buffer data = 3;
  // The shared buffer the bytes went out in, when asked for (`SharedBuffer`).
  uint64 shared_id = 4;
}

// ---------------------------------------------------------------- datasets

// The roles and columns of a load, as the viewer's `ColumnMapping` gives them.
message DatasetMapping {
  string x = 1;
  string y = 2;
  string z = 3;
  string time = 4;
  // `TimeUnit`: "seconds", "milliseconds", "unix_milliseconds", ...
  string time_unit = 5;
  // "none", "yawPitch" or "vector".
  string look_mode = 6;
  string yaw = 7;
  string pitch = 8;
  string dir_x = 9;
  string dir_y = 10;
  string dir_z = 11;
  bool degrees = 12;
  string person = 13;
  string team = 14;
  string session = 15;
  // Columns loaded with the rows, in order.
  repeated ExtraColumn extra = 16;
  // Columns left in the files until asked for (`ReadDatasetColumns`).
  repeated ExtraColumn on_demand = 17;
  bool up_z = 18;
  bool flip_x = 19;
  bool flip_y = 20;
  bool flip_z = 21;
  double scale = 22;
}

message ExtraColumn {
  string name = 1;
  bool numeric = 2;
}

// Reads a Parquet selection and builds the viewer's dataset of it: everything the
// viewer's own build does after reading (`ingestFiles`, `DatasetBuilder`), held
// by the core under a handle until closed (`CloseDataset`). The columns are then
// read with `ReadDatasetColumns`, the engine's chunks with `ReadChunk`. A load the
// core does not build (ISO-8601 text times, a person's objects) is answered
// UNSUPPORTED, and the viewer builds it itself.
message BuildDataset {
  repeated FileRef files = 1;
  // Each file's name as the viewer shows it (the `Source file` column).
  repeated string names = 2;
  DatasetMapping mapping = 3;
  repeated RowFilterClause filter = 4;
  uint32 stride = 5;
  // The most rows the viewer keeps: past it, its copy is every k-th row, and the
  // chunks still hold every row. 0 for no limit.
  uint64 page_rows = 6;
  // Rows per chunk; 0 for the engine's 2^23.
  uint32 chunk_rows = 7;
  // A token the viewer polls `BuildProgress` with.
  string progress_token = 8;
}

message BuiltFile {
  uint64 rows = 1;
  uint64 rejected = 2;
  FilterStats filtered = 3;
  // Why the file gave nothing: a message key of the viewer and its values, or text.
  string failure_key = 4;
  map<string, string> failure_params = 5;
  string failure_text = 6;
  // The footer's `heat3d` entry, as written.
  string hints_json = 7;
  // The file's time is wall-clock (TIMESTAMP, unix units).
  bool time_absolute = 8;
}

message BuiltAttr {
  string name = 1;
  bool numeric = 2;
  double min = 3;
  double max = 4;
  repeated string categories = 5;
}

message DroppedColumn {
  string name = 1;
  uint64 count = 2;
}

// One chunk of the engine's layout, as `WebgpuRenderer.landChunk` keeps it.
message DatasetChunk {
  uint32 index = 1;
  uint64 start = 2;
  uint32 rows = 3;
  repeated double aabb_min = 4;
  repeated double aabb_size = 5;
  double time_min = 6;
  double time_scale = 7;
  double life_scale = 8;
}

message DatasetBuilt {
  uint64 handle = 1;
  // Every row the build kept; the chunks hold them all.
  uint64 rows = 2;
  repeated BuiltFile files = 3;
  // Files that gave a block (read, even if every row was filtered out).
  uint32 sources = 4;
  uint64 rejected = 5;
  bool has_time = 6;
  optional double epoch_ms = 7;
  double time_origin = 8;
  repeated double time_range = 9;
  repeated string person_labels = 10;
  repeated string team_labels = 11;
  // Teams before the ceiling dropped the team column; 0 when kept.
  uint64 teams_dropped = 12;
  repeated string session_labels = 13;
  uint64 sessions_dropped = 14;
  double max_lifetime_gap = 15;
  uint64 shared_count = 16;
  repeated BuiltAttr attrs = 17;
  repeated DroppedColumn dropped_columns = 18;
  // minX, minY, minZ, maxX, maxY, maxZ.
  repeated double bounds = 19;
  uint64 aligned = 20;
  // `Dataset.series` as JSON, or empty.
  string series_json = 21;
  repeated DatasetChunk chunks = 22;
  // The viewer's copy: its rows, and the step between them (1: every row).
  uint64 page_rows = 23;
  uint32 page_step = 24;
  // The copy's own largest lifetime, when it is every k-th row.
  double page_max_lifetime_gap = 25;
  // Columns `ReadDatasetColumns` gives: "@px", "@time", ... and the attributes by name.
  repeated string columns = 26;
  // Columns left in the files, read when asked.
  repeated string on_demand = 27;
  Timing timing = 28;
  uint64 peak_memory_bytes = 29;
  // Whether the core hands columns over in shared memory (the app's window).
  bool shared = 30;
}

// Columns of a built dataset: the viewer's copy of them, or one chunk's rows of
// them as the GPU's filter columns take them (float32).
message ReadDatasetColumns {
  uint64 handle = 1;
  repeated string names = 2;
  // One chunk's rows, as float32; otherwise the viewer's copy.
  bool by_chunk = 3;
  uint32 chunk = 4;
  // Hand the bytes over in shared memory (`DatasetColumn.shared_id`).
  bool shared = 5;
}

message DatasetColumn {
  string name = 1;
  // "f32", "u32", "u16" or "u8".
  string element = 2;
  Buffer values = 3;
  uint64 shared_id = 4;
  // A column read on demand: its categories, or its range.
  repeated string categories = 5;
  bool numeric = 6;
  double min = 7;
  double max = 8;
  // Elements in the column (a shared buffer may be longer).
  uint64 count = 9;
}

message DatasetColumns {
  repeated DatasetColumn columns = 1;
}

message BuildProgress {
  string token = 1;
}

message BuildProgressReply {
  // The build's step: "count", "read", "time", "sort", "extent", "lifetimes", "chunks", or empty.
  string phase = 1;
  double fraction = 2;
}

// ---------------------------------------------------------------- queries

message Query {
  oneof kind {
    CountRows count = 1;
  }
}

// Rows the filter keeps across files, read from the filter's columns alone.
message CountRows {
  repeated FileRef files = 1;
  repeated RowFilterClause filter = 2;
}

message QueryReply {
  oneof kind {
    RowCount count = 1;
  }
}

message RowCount {
  uint64 matched = 1;
  uint64 scanned_rows = 2;
  uint32 scanned_files = 3;
  uint64 rows_skipped = 4;
  uint64 groups = 5;
  uint64 groups_skipped = 6;
}
