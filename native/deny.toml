# cargo-deny: what the native workspace may depend on (CI: session-security.yml).
# Known vulnerabilities fail; crates only from crates.io; licences that let
# the MIT-licensed binaries be shipped.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep in the Tauri/GTK stack are not ours to replace: reported, not failed.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
