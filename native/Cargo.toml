[workspace]
resolver = "2"
members = ["crates/proto", "crates/core", "crates/library", "crates/sandbox", "crates/session", "crates/server", "crates/extractors", "crates/app-tauri"]
# Built with nightly by cargo-fuzz, apart from the rest.
exclude = ["crates/session/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
heat3d-proto = { path = "crates/proto" }
heat3d-core = { path = "crates/core" }
heat3d-library = { path = "crates/library" }
heat3d-server = { path = "crates/server" }
heat3d-session = { path = "crates/session" }
heat3d-extractors = { path = "crates/extractors" }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
anyhow = "1"
rayon = "1"
memmap2 = "0.9"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 4
lto = "thin"
