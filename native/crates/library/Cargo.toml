[package]
name = "heat3d-library"
description = "3DHeat Library: the local catalogue of replays, recordings, converted matches and extracted levels, with thumbnails and the conversion queue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
heat3d-core.workspace = true
anyhow.workspace = true
rayon.workspace = true
memmap2.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
walkdir = "2.5"
sha2 = "0.10"
flate2 = "1"
png = "0.18"
snap = "1"
getrandom = "0.3"
parquet = { version = "60", default-features = false, features = ["snap", "zstd", "lz4", "flate2", "flate2-rust_backend", "brotli"] }

[dev-dependencies]
tempfile = "3"
