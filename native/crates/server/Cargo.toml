[package]
name = "heat3d-server"
description = "3DHeat server: the native core's data API, the web viewer and the multiplayer session server, headless or inside the app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "3dheat"
path = "src/main.rs"

[dependencies]
heat3d-core.workspace = true
heat3d-library.workspace = true
heat3d-session.workspace = true
heat3d-extractors.workspace = true
heat3d-sandbox = { path = "../sandbox" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time", "process", "sync"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
# The update check (src/update.rs): GitHub over HTTPS as the extractors manager asks it, and the
# release signature (minisign, the key Tauri's updater uses too).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.23"
minisign-verify = "0.3"
tower = { version = "0.5", features = ["util"] }
