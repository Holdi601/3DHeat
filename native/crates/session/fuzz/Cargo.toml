[package]
name = "heat3d-session-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
prost = "0.14"
heat3d-session = { path = ".." }

# Its own workspace: built with nightly by cargo-fuzz, apart from the rest.
[workspace]
members = ["."]

[[bin]]
name = "client_msg"
path = "fuzz_targets/client_msg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "doc_json"
path = "fuzz_targets/doc_json.rs"
test = false
doc = false
bench = false
