[package]
name = "heat3d-session"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "3DHeat multiplayer session server: roles, limits, presence, follow, look-here and the shared layers' operation log"
publish = false

# Its own workspace until the native workspace (native/Cargo.toml) lists it.
[workspace]
exclude = ["fuzz"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "3dheat"
path = "src/bin/3dheat.rs"

[dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
if-addrs = "0.13"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
tokio-tungstenite = "0.29"
