[package]
name = "heat3d-session"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "3DHeat multiplayer session server: roles, limits, presence, follow, look-here and the shared layers' operation log"
publish = false

[lib]
path = "src/lib.rs"

# `3dheat serve` is built in crates/server: this session server and the native
# core's data API in one program.

[dependencies]
heat3d-proto = { path = "../proto" }
heat3d-sandbox = { path = "../sandbox" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "io-std"] }
axum = { version = "0.8", features = ["ws"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
if-addrs = "0.13"
hyper-util = { version = "0.1", features = ["tokio"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
tokio-rustls = { version = "0.26", default-features = false }
bytes = "1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tokio-tungstenite = "0.29"
