[package]
name = "heat3d-core"
description = "3DHeat native core: ingest, sort and the engine's chunk layout"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
heat3d-proto.workspace = true
prost.workspace = true
anyhow.workspace = true
rayon.workspace = true
memmap2.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
ryu-js = "1"
half = "2"
flate2 = "1"
sha2 = "0.11"
getrandom = "0.4"
zstd = "0.14"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2", "flate2-rust_backend", "brotli"] }
arrow-array = "60"
arrow-schema = "60"
arrow-buffer = "60"

[dev-dependencies]
