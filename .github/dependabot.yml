# Update pull requests for known-vulnerable and outdated dependencies.
# Pull requests only: nothing is merged without review.
# Minor and patch updates come once a week as one grouped pull request per
# ecosystem; major updates still come one by one. Security updates are not
# grouped: each arrives as soon as its advisory does.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # windows and windows-core must stay on the version Tauri's webview2-com
      # is built on (0.62 with webview2-com 0.39): a newer one alone does not
      # compile. They move together with a Tauri update. Patches still come.
      - dependency-name: windows
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: windows-core
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/reverse-proxy
    schedule:
      interval: weekly
