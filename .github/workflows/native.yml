# The native app (native/, docs/native-app.md): the core's tests and the
# installers, on Windows and on Linux (glibc of Ubuntu 22.04, for reach).
# Unsigned, and staying so: no signing key is kept on GitHub. Release drafts come
# from release.yml; the maintainer signs them locally (native/tools/sign-release.ps1).
name: native

on:
  push:
    branches: [main]
    paths: ['native/**', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libwayland-dev libxdo-dev libssl-dev patchelf libvulkan1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Viewer dependencies
        run: npm ci
      - name: Native tool dependencies
        working-directory: native
        run: npm ci
      - name: Protocol types are current
        working-directory: native
        shell: bash
        run: |
          npx buf generate
          git diff --exit-code -- ../src/data/native/gen
      - name: Core tests
        working-directory: native
        run: cargo test -p heat3d-core -p heat3d-proto -p heat3d-library -p heat3d-session -p heat3d-server -p heat3d-extractors -p heat3d-viewport
      - name: Viewer tests of the shared vectors and the native viewport's shader copies
        run: npx vitest run src/data/containerVectors.test.ts src/render/native/shaderExport.test.ts
      - name: Icons
        working-directory: native
        run: |
          npx playwright install chromium
          npm run icons
      - name: Installers
        working-directory: native
        run: npx tauri build
      - name: Headless server
        working-directory: native
        run: cargo build --release -p heat3d-server
      - uses: actions/upload-artifact@v4
        with:
          name: 3dheat-${{ matrix.os }}
          path: |
            native/target/release/bundle/nsis/*.exe
            native/target/release/bundle/msi/*.msi
            native/target/release/bundle/appimage/*.AppImage
            native/target/release/bundle/deb/*.deb
            native/target/release/bundle/rpm/*.rpm
            native/target/release/3dheat
            native/target/release/3dheat.exe
          if-no-files-found: warn
